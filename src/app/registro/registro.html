<h1>Registro de usuario</h1>

<form [formGroup]="formulario" (ngSubmit)="registrar()">

<label for="nombre">Nombre:</label>
<input type="text" id="nombre" formControlName="nombre" required>

<label for="apellido">Apellido:</label>
<input type="text" id="apellido" formControlName="apellido" required>

<label for="correo">Correo:</label>
<input type="email" id="correo" formControlName="correo" required>

<label for="contrasena">Contraseña:</label>
<input type="password" id="contrasena" formControlName="contrasena" required>

<button type="submit" [disabled]="formulario.invalid">
    Registrarse
</button>

</form>
