
name: CI de Registro de Usuarios

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test -- --watch=false

      - name: Compilar Angular
        run: npm run build

      - name: Guardar compilación
        uses: actions/upload-artifact@v4
        with:
          name: registro-usuarios-build
          path: dist/registro-usuarios
          if-no-files-found: error
